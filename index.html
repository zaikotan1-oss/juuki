<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="重機">
<meta name="theme-color" content="#1b2838">
<link rel="manifest" href="manifest.webmanifest">
<title>重機で建てる（試作）</title>
<style>
html,body{margin:0;height:100%;background:#1b2838;overflow:hidden;touch-action:none;
  font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{display:none;position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));
  color:#fff;font-size:14px;line-height:1.45;background:#0008;padding:6px 10px;border-radius:10px;pointer-events:none;white-space:pre}
#btns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#btns .btn{font-size:11px;padding:5px 8px;border-radius:9px;box-shadow:0 2px 0 #0005}
.btn{border:0;border-radius:12px;background:#fffe;color:#223;font:inherit;font-weight:bold;font-size:13px;padding:7px 10px;
  box-shadow:0 3px 0 #0005;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.btn.on{background:#ffd23f}
.stick{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
  background:#0004;border:3px solid #fff8;pointer-events:none}
.stick .knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:#fffc;box-shadow:0 3px 8px #0006}
.stick .lab{position:absolute;left:-10px;right:-10px;bottom:118px;text-align:center;color:#fff;font-size:12px;font-weight:bold;line-height:1.3;background:#0008;border-radius:8px;padding:3px 5px}
#stL{left:calc(22px + env(safe-area-inset-left))}
#stR{right:calc(22px + env(safe-area-inset-right))}
#pedals{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:flex-end}
.pd{border:0;border-radius:14px;font:inherit;font-weight:bold;color:#223;background:#fffd;box-shadow:0 5px 0 #0006;touch-action:none}
.pd.on{transform:translateY(4px);box-shadow:0 1px 0 #0006;filter:brightness(.85)}
#pFwd,#pBack{width:68px;height:84px;font-size:15px}
#pFwd{background:#8fe08f} #pBack{background:#f4b2a0}
#bRide{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));font-size:16px;padding:9px 20px;background:#fffe}
#bRide.on{background:#7fd1ff}
#bRide:active{transform:translate(-50%,2px)}
#pLeft,#pRight{width:48px;height:58px;font-size:20px}
#done{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);color:#223;font-size:22px;font-weight:bold;background:#ffd23f;padding:12px 22px;border-radius:18px;text-align:center;box-shadow:0 6px 0 #0005;pointer-events:none}
#done .btn{pointer-events:auto;margin:10px 5px 0;font-size:16px;padding:9px 14px}
#done .rT{font-size:24px} #rStars{font-size:34px;color:#d9480f;letter-spacing:6px;text-shadow:0 2px 0 #fff8} #rInfo{font-size:14px;white-space:pre-line;margin-top:4px}
#goal{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));width:min(28vw,220px);color:#fff;background:#0007;border-radius:8px;padding:4px 7px;pointer-events:none;font-weight:bold}
#gStage{font-size:10px;opacity:.8} #gText{font-size:12px;line-height:1.25;margin:1px 0 3px} #gScore{position:absolute;right:7px;top:3px;font-size:10px;color:#ffd23f}
.gbar{position:relative;height:11px;background:#fff3;border-radius:6px;overflow:hidden;margin-top:2px} .gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffcf3f,#f08c00);transition:width .3s}
.gbar.tr i{background:linear-gradient(#8fe08f,#2f9e44)} .gbar span{position:relative;font-size:10px;padding-left:5px;line-height:11px;text-shadow:0 1px 2px #000}
#pops{position:absolute;left:50%;top:30%;width:0;height:0;pointer-events:none}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;color:#fff;font-weight:900;font-size:21px;text-shadow:0 3px 0 #000a,0 0 8px #000;animation:popup 1.3s ease-out forwards}
.pop.mid{font-size:27px;color:#ffd23f} .pop.big{font-size:34px;color:#ff922b} .pop.mile{font-size:25px;color:#8ce99a;top:45px} .pop.load{font-size:20px;color:#8ce99a;top:82px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px)}}
#stages{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1b2838ee;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #0005;width:min(90vw,600px);max-height:92vh;overflow:auto;z-index:20}
.stCols{display:flex;gap:14px;flex-wrap:wrap} .stCol{flex:1 1 230px;display:flex;flex-direction:column;gap:5px;border-radius:12px;padding:8px}
.stCol.d{background:#ffb02e} .stCol.b{background:#5fb3f0}
.stCol.d .stBtn{background:#fff3df} .stCol.b .stBtn{background:#e6f4ff}
.stHead{font-size:15px;font-weight:900;color:#fff;text-align:center;text-shadow:0 1px 2px #0008;padding:2px}
.stBtn.now{outline:3px solid #223} .stClose{font-size:13px;align-self:center}
.stTitle{font-size:17px;font-weight:900;color:#fff;text-align:center} .stBtn{font-size:13px;text-align:left;padding:6px 10px;box-shadow:0 2px 0 #0004} .stBtn small{display:block;font-size:10px;font-weight:bold;opacity:.82;margin-top:1px} .stBtn.locked{opacity:.55}
.stUp{font-size:17px;color:#223;white-space:pre-line;font-weight:bold}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);color:#fff;font-size:19px;font-weight:bold;background:#0009;padding:7px 16px;border-radius:14px;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));max-width:40vw;text-align:center;color:#fff;font-size:15px;font-weight:bold;background:#0009;padding:7px 12px;border-radius:14px;pointer-events:none}
#msg .lbar{width:260px;height:10px;background:#fff3;border-radius:5px;margin:10px auto 6px;overflow:hidden}#msg .lbar i{display:block;height:100%;background:#7cd67c}#msg small{font-size:14px;opacity:.85}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:22px;background:#000a;padding:14px 22px;border-radius:14px;text-align:center;white-space:pre-line}

/* ===== 売り物のスマホゲーム風の見た目（10-25 改善ループ 2）。大きさは今のまま、形・色・縁・動きだけ ===== */
:root{--ink:#16263a;--panel:linear-gradient(#2c4566f0,#162a42f0);--edge:#ffffff66}
.btn{background:linear-gradient(#ffffff,#dfe8f3);color:#1d3557;border:2px solid #fff;box-shadow:0 3px 0 #8aa0b8,0 5px 8px #0005,inset 0 -2px 0 #0001;text-shadow:0 1px 0 #fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8aa0b8,0 2px 4px #0004}
.btn.on{background:linear-gradient(#ffe680,#f5b300);color:#5a3a00;box-shadow:0 3px 0 #a87400,0 5px 8px #0005}
#btns{gap:5px}
#btns .btn{font-size:10px;padding:4px 8px 4px 6px;border-radius:999px;background:var(--panel);color:#fff;border:1.5px solid var(--edge);box-shadow:0 2px 0 #0007,0 4px 8px #0004;text-shadow:0 1px 1px #000}
#btns .btn:active{transform:translateY(2px) scale(.96);box-shadow:0 0 0 #0007}
#bStage::before{content:"🗺 "} #bView::before{content:"🎥 "} #bShadow::before{content:"🌓 "} #bQuality::before{content:"✨ "} #bReset::before{content:"🔄 "}
#bStage{background:linear-gradient(#ffb547,#e8790c)!important;border-color:#ffe0a8!important}
.stick{background:radial-gradient(circle,#ffffff18 0 55%,#ffffff30 56% 60%,#0003 61%);border:2.5px solid #ffffffaa;box-shadow:0 4px 12px #0005,inset 0 0 12px #0004}
.stick .knob{background:radial-gradient(circle at 35% 30%,#fff,#d6e2ef 60%,#a9bdd3);border:2px solid #fff;box-shadow:0 4px 10px #0007}
.stick .lab,#hint,#toast,#msg{background:var(--panel);border:1.5px solid var(--edge);box-shadow:0 3px 0 #0006;text-shadow:0 1px 2px #000}
.stick .lab{font-size:11px;border-radius:9px}
#hint::before{content:"💡 "}
.pd{border:2px solid #fff;color:#fff;text-shadow:0 1px 0 #0006,0 0 3px #0005}
#pFwd{background:linear-gradient(#86e486,#2f9e44);box-shadow:0 5px 0 #1e6b2e,0 7px 10px #0005}
#pBack{background:linear-gradient(#ff9e80,#e0543a);box-shadow:0 5px 0 #9c3020,0 7px 10px #0005}
#pLeft,#pRight{background:linear-gradient(#ffffff,#d5e0ec);color:#1d3557;text-shadow:none;box-shadow:0 5px 0 #8aa0b8,0 7px 10px #0005}
.pd.on{filter:brightness(1.15);transform:translateY(4px)}
#pFwd.on{box-shadow:0 1px 0 #1e6b2e,0 0 14px #8ce99a} #pBack.on{box-shadow:0 1px 0 #9c3020,0 0 14px #ffb4a0}
#bRide{font-size:13px;padding:6px 16px;background:var(--panel);color:#fff;border:1.5px solid var(--edge);box-shadow:0 3px 0 #0007;text-shadow:0 1px 1px #000;bottom:calc(112px + env(safe-area-inset-bottom))}
#bRide::before{content:"🚪 "}
#bRide.on{background:linear-gradient(#5fc0ff,#1f7fd0)}
#goal{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1.5px solid var(--edge);border-radius:12px;padding:5px 8px 6px;box-shadow:0 3px 0 #0006,0 6px 12px #0004}
#gStage{font-size:10px;color:#9fd0ff;letter-spacing:.5px;padding-right:44px}
#gText{font-size:11.5px;line-height:1.25;margin:0 0 2px;max-height:2.5em;overflow:hidden;text-shadow:0 1px 1px #000}
#gScore{position:absolute;right:7px;top:4px;font-size:11px;color:#ffd23f;text-shadow:0 1px 0 #7a4b00}
.gbar{height:12px;margin-top:0;background:#0006;border:1px solid #ffffff40;border-radius:7px;box-shadow:inset 0 2px 3px #0006}
.gbar i{border-radius:7px;box-shadow:inset 0 2px 0 #fff6} .gbar span{display:block;font-size:10px;line-height:12px;text-shadow:0 0 3px #000,0 1px 0 #000;white-space:nowrap}   /* 行の中に置くと下にずれて半分切れていた */
.pop{font-family:inherit;-webkit-text-stroke:1.5px #3a1d00;paint-order:stroke fill;letter-spacing:1px}
.pop.big{font-size:38px;color:#ffd23f;text-shadow:0 4px 0 #b84a00,0 0 18px #ff8a00aa;animation:popbig 1.5s ease-out forwards}
@keyframes popbig{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,0) scale(1.35) rotate(3deg)}24%{transform:translate(-50%,0) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fffbe8 0,#fff6d0aa 40%,#fff0 75%);opacity:0;z-index:5}
#combo{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:none;color:#fff;font-weight:900;font-size:13px;background:var(--panel);border:1.5px solid var(--edge);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 #0006;text-shadow:0 1px 1px #000}
#combo b{font-size:20px;color:#ffd23f;margin-right:3px;-webkit-text-stroke:1px #7a3b00;paint-order:stroke fill}
#combo[data-tier="2"] b{color:#ff9f43} #combo[data-tier="3"]{background:linear-gradient(#ff8a3d,#c2410c);border-color:#ffd8a8} #combo[data-tier="3"] b{color:#fff}
#combo.bump{animation:cbump .18s ease-out}
@keyframes cbump{0%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
#done{background:linear-gradient(#fff3c4,#ffd56b 55%,#ffb92e);border:3px solid #fff;border-radius:20px;padding:0 22px 14px;box-shadow:0 6px 0 #b56a00,0 14px 30px #0008;min-width:300px}
#done.show{animation:resPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes resPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#done .rT{font-size:22px;color:#fff;background:linear-gradient(#ff9a4d,#e8590c);margin:-14px -10px 6px;padding:7px 16px;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 #9a3a00;text-shadow:0 2px 0 #7a2e00;letter-spacing:1px}
#rStars{font-size:44px;letter-spacing:4px;line-height:1.1;text-shadow:none}
#rStars span{display:inline-block;opacity:0} #rStars span.on{opacity:1;animation:starIn .45s cubic-bezier(.2,1.6,.4,1)}
#rStars .got{color:#ffd000;-webkit-text-stroke:2px #b85c00;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #9a4a00)}
#rStars .no{color:#c99a4a66;-webkit-text-stroke:2px #8a5a1a55}
@keyframes starIn{0%{opacity:1;transform:scale(2.6) rotate(-30deg)}70%{transform:scale(.88) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#rInfo{color:#5a3a00;font-size:13px}
#done .btn{font-size:14px;padding:8px 14px}
#bNext{background:linear-gradient(#86e486,#2f9e44)!important;color:#fff!important;border-color:#fff!important;box-shadow:0 4px 0 #1e6b2e,0 6px 10px #0005!important;text-shadow:0 1px 0 #1e6b2e!important;font-size:16px!important;padding:9px 20px!important}
#bAgain{background:#0000002a!important;color:#5a3a00!important;border-color:#fff8!important;box-shadow:none!important;text-shadow:none!important;font-size:12px!important}
#stages{background:var(--panel);border:2px solid var(--edge);border-radius:18px;box-shadow:0 6px 0 #0007,0 16px 36px #0009;animation:resPop .3s cubic-bezier(.2,1.4,.4,1)}
.stTitle{align-self:center;background:linear-gradient(#ffb547,#e8790c);border:2px solid #fff;border-radius:999px;padding:3px 22px;box-shadow:0 3px 0 #9a4a00;text-shadow:0 2px 0 #7a2e00;margin-top:-2px}
.stCol{border:2px solid #fff8;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0004}
.stCol.d{background:linear-gradient(#ffc45e,#f08c00)} .stCol.b{background:linear-gradient(#7cc4f5,#2f86d0)}
.stBtn{border:1.5px solid #fff;border-radius:10px;box-shadow:0 3px 0 #0003}
.stBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0003}
.stBtn.now{outline:none;background:#fff7c2!important;box-shadow:0 0 0 3px #ffd23f,0 3px 0 #0003}

/* ---- 第 2 回（10-25） ---- */
#pLeft,#pRight{background:var(--panel);color:#fff;border:2px solid var(--edge);box-shadow:0 5px 0 #0007,0 7px 10px #0005;text-shadow:0 1px 1px #000}
#pFwd::before{content:"▲";display:block;font-size:11px;line-height:1;margin-bottom:2px} #pBack::before{content:"▼";display:block;font-size:11px;line-height:1;margin-bottom:2px}
#pFwd,#pBack{font-weight:900}
#gText{font-weight:900;font-size:12px}
.gbar i{background:linear-gradient(#ffe27a,#f0a000)} .gbar.tr i{background:linear-gradient(#a7f3a7,#33b34a)}
.gbar span{text-shadow:0 0 3px #000,0 1px 0 #000,0 -1px 0 #000}
#hint{font-size:13px;padding:5px 11px;bottom:calc(160px + env(safe-area-inset-bottom))}
.stick .lab{white-space:nowrap;font-size:10px;left:-30px;right:-30px}
#btns .btn:active{filter:brightness(1.25)}
#done::before{content:"";position:absolute;left:50%;top:20px;width:220px;height:220px;margin-left:-110px;background:radial-gradient(#fff9,#fff0 68%);z-index:-1;pointer-events:none;animation:spinGlow 6s linear infinite}
@keyframes spinGlow{to{transform:rotate(360deg)}}
.rScore{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:2px}
.rScore small{font-size:12px;color:#7a3b00;font-weight:900}
.rScore b{font-size:30px;font-weight:900;color:#e8590c;-webkit-text-stroke:1.5px #fff;paint-order:stroke fill;text-shadow:0 3px 0 #9a3a00;line-height:1}
.rScore em{font-style:normal;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(#ff5e7e,#d6336c);border:1.5px solid #fff;border-radius:999px;padding:2px 8px;box-shadow:0 2px 0 #8a1c43;animation:recPulse .6s ease-in-out infinite alternate}
@keyframes recPulse{to{transform:scale(1.12)}}
.rSub{font-size:12px;color:#7a3b00;font-weight:bold;margin-top:2px}
.rUnlock{display:inline-block;margin-top:5px;background:linear-gradient(#fff,#ffe9a8);border:1.5px solid #fff;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:900;color:#7a3b00;box-shadow:0 2px 0 #c99a3a}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#fff;font-size:22px;font-weight:900;background:linear-gradient(#ffb547,#e8790c);border:3px solid #fff;border-radius:999px;padding:4px 28px 6px;box-shadow:0 4px 0 #9a4a00,0 10px 20px #0006;text-shadow:0 2px 0 #7a2e00;white-space:nowrap}
#banner small{display:block;font-size:11px;letter-spacing:2px;opacity:.9}
#banner.show{animation:banIn 1.9s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes banIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
.stBtn{position:relative;padding-left:32px}
.stNo{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;font-style:normal;font-size:11px;line-height:19px;text-align:center;color:#fff;font-weight:900;box-shadow:0 2px 0 #0003}
.stCol.d .stNo{background:linear-gradient(#ffb547,#e8790c)} .stCol.b .stNo{background:linear-gradient(#5fb3f0,#1f6fc0)}
.stBtn.clear .stNo{background:linear-gradient(#ffe066,#e0a000)}
.stStars{margin-left:6px;font-size:11px;letter-spacing:1px;color:#0002}
.stStars em{font-style:normal;color:#ffc400;-webkit-text-stroke:.6px #b85c00;paint-order:stroke fill}
.stick .lab:empty,#gText:empty{display:none}
#stL .lab{left:-12px;right:auto} #stR .lab{right:-12px;left:auto}   /* 1 行にしたら左右の外へはみ出した */

/* ---- 第 3 回（10-25） ---- */
#goal,#done,.stBtn,.pd,#btns .btn,.stick .lab,#hint,#bRide,#combo{box-shadow:inset 0 1px 0 #fff4,inset 0 -2px 0 #0004,0 3px 0 #0006,0 5px 10px #0004}
#goal,.stick .lab,#hint,#bRide,#combo{border-width:2px}
.pd{transition:transform .06s,filter .06s}
.pd.on{transform:translateY(3px) scale(.94);filter:brightness(1.25);box-shadow:inset 0 3px 6px #0006!important}
#pLeft.on,#pRight.on{background:linear-gradient(#4f86c6,#2c5a92)}
#btns .btn:active,.stBtn:active,#done .btn:active{filter:brightness(1.2);transition:transform .06s}
#dim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,#0000 25%,#000a 100%);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.rScore b.cnt{animation:cnt .18s ease-out}
@keyframes cnt{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.stBtn.next{animation:nextPulse 1.6s ease-in-out infinite}
.stBtn.next::after{content:"NEW";position:absolute;right:6px;top:-6px;font-size:9px;font-weight:900;color:#fff;background:linear-gradient(#ff5e7e,#d6336c);border:1.5px solid #fff;border-radius:999px;padding:0 5px;box-shadow:0 2px 0 #8a1c43}
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 0 #ffd54a99,0 3px 0 #0003}50%{box-shadow:0 0 0 5px #ffd54a00,0 3px 0 #0003}}
#bGear::before{content:"⚙️ "}
#btns .btn.opt{display:none} #btns.open .btn.opt{display:inline-block}

/* ---- 第 4 回（10-25） ---- */
#gText{text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.pop.tiny{font-size:15px;color:#fff;-webkit-text-stroke:1px #3a1d00;animation:poptiny .7s ease-out forwards}
@keyframes poptiny{0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),30px) scale(.6)}20%{opacity:1;transform:translate(calc(-50% + var(--dx,0px)),20px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-10px) scale(1)}}
.rSub{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:5px}
.rSub span{background:#fff8;border:1.5px solid #fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:900;color:#7a3b00;box-shadow:0 2px 0 #c99a3a}
.rScore{border-bottom:2px solid #e8a33a66;padding-bottom:2px;margin:2px 30px 0}
#done .rT{background-image:linear-gradient(115deg,#fff0 40%,#fff8 50%,#fff0 60%),linear-gradient(#ff9a4d,#e8590c);background-size:300% 100%,100% 100%;background-position:150% 0,0 0}
#done.show .rT{animation:shine 1.1s .7s ease-out}
@keyframes shine{from{background-position:150% 0,0 0}to{background-position:-60% 0,0 0}}
.stBtn.clear{border-left:4px solid #ffc83a}
.stStars em{text-shadow:0 0 4px #ffb300}
.stStars{color:#0000;-webkit-text-stroke:.8px #0004}
.stStars em{-webkit-text-stroke:.6px #b85c00}
.pd:not(.on){animation:none}

/* ---- 第 5 回（10-25） ---- */
#goal{background:linear-gradient(#2b4a7d,#1a2f55)}
#gStage{font-size:10.5px;font-weight:900;color:#a9d4ff;text-shadow:0 1px 0 #000a}
#gText{-webkit-text-stroke:.4px #0008;paint-order:stroke fill}
#gScore{font-weight:900;color:#ffd54a;-webkit-text-stroke:.6px #b85c00;paint-order:stroke fill;text-shadow:0 0 4px #ffb300}
#btns .btn::before{font-size:12px;vertical-align:-1px}
#bAgain{background:linear-gradient(#fff,#ffe9b8)!important;color:#a14b00!important;border:2px solid #e8a33a!important;box-shadow:0 3px 0 #c98a2a!important;opacity:1}
.pop.tiny{-webkit-text-stroke:2px #3a1d00;text-shadow:0 2px 0 #3a1d00;font-size:16px}
.rBest{font-size:11px;font-weight:900;color:#a14b00;margin-top:4px;min-height:1px}
.rBest:empty{display:none}

/* ---- 第 6 回（10-25） ---- */
#goal{text-shadow:0 1px 0 #0a1630,0 0 3px #0a1630}
#gStage{font-size:11px}
.gbar{height:13px;border-radius:999px;background:#0a1630;border:1.5px solid #5d86c4;box-shadow:inset 0 2px 3px #0008}
.gbar i{border-radius:999px;box-shadow:inset 0 1px 0 #fff8,0 0 6px #ffb30088}
.stick .lab{background:linear-gradient(#2b4a7d,#1a2f55);color:#fff}
#bNext{animation:nextPulse2 1.6s ease-in-out 1.6s infinite}
@keyframes nextPulse2{0%,100%{box-shadow:0 4px 0 #1e6b2e,0 6px 10px #0005,0 0 0 0 #8ce99a99}50%{box-shadow:0 4px 0 #1e6b2e,0 6px 10px #0005,0 0 0 6px #8ce99a00}}
#bAgain{font-size:12.5px!important}
.pop.tiny.gold{font-size:21px;color:#ffd23f}
#flash.warm{background:radial-gradient(circle at 50% 45%,#fff3c8 0,#ffc26baa 40%,#ff8a0000 75%)}

/* ---- 第 7 回（10-25） ---- */
#hint{max-width:34vw;font-size:12px;padding:4px 10px;opacity:.94}
.gbar{height:15px} .gbar span{line-height:15px;font-weight:900}
#pLeft,#pRight{background:linear-gradient(#5b7fb0,#2c4a78);border:2px solid #fff9;box-shadow:0 5px 0 #14284a,0 7px 10px #0005,inset 0 1px 0 #fff5;font-size:16px}
.pop.tiny.gold.huge{font-size:28px;-webkit-text-stroke:2.5px #5a2a00}
#done.jolt{animation:jolt .18s ease-out}
@keyframes jolt{0%{transform:translate(-50%,calc(-50% + 3px)) scale(1.02)}100%{transform:translate(-50%,-50%) scale(1)}}
#done.glow{box-shadow:0 6px 0 #b56a00,0 14px 30px #0008,0 0 0 4px #ffe58a,0 0 24px 6px #ffd54a99;transition:box-shadow .4s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">読み込み中…</div>
<div id="btns">
  <button class="btn" id="bStage">ステージ</button>
  <button class="btn" id="bView">運転席</button>
  <button class="btn opt" id="bShadow">影 ON</button>
  <button class="btn opt" id="bQuality">画質 高</button>
  <button class="btn" id="bReset">やり直し</button>
  <button class="btn" id="bGear">せってい</button>
</div>
<div class="stick" id="stL"><div class="lab" id="labL"></div><div class="knob"></div></div>
<div id="pedals"><button class="pd" id="pLeft">◀</button><button class="pd" id="pBack">バック</button><button class="pd" id="pFwd">アクセル</button><button class="pd" id="pRight">▶</button></div>
<div class="stick" id="stR"><div class="lab" id="labR"></div><div class="knob"></div></div>
<button class="btn" id="bRide" style="display:none">おりる</button>
<div id="msg">読み込み中…</div>
<div id="dim" style="display:none"></div>
<div id="done" style="display:none"><div class="rT">さら地 かんせい！</div><div id="rStars"></div><div id="rInfo"></div>
<div class="rBtns"><button class="btn" id="bNext">つぎの ビルへ ▶</button><button class="btn" id="bBuild">クレーンで 建てる ▶</button><button class="btn" id="bAgain">ステージを えらぶ</button></div></div>
<div id="goal"><div id="gStage"></div><div id="gText">読み込み中…</div><div class="gbar"><i id="gBld"></i><span id="gBldT"></span></div><div class="gbar tr"><i id="gTr"></i><span id="gTrT"></span></div><div id="gScore"></div></div>
<div id="pops"></div>
<div id="flash"></div>
<div id="banner" style="display:none"></div>
<div id="combo" style="display:none"><b>0</b>こわし</div>
<div id="stages" style="display:none"></div>
<div id="toast" style="display:none"></div>
<div id="hint" style="display:none"></div>
<script>
// 読み込み画面: 先に全ファイルを取ってきて「何MB中何MB」を出す（ブラウザに残るので、後でゲームが読む時は一瞬）
(async () => {
  const msg = document.getElementById("msg");
  const show = (got, all) => {
    const pc = all ? Math.min(100, Math.floor(got / all * 100)) : 0;
    msg.innerHTML = `読み込み中… ${pc}%<div class="lbar"><i style="width:${pc}%"></i></div><small>${(got / 1e6).toFixed(1)} / ${(all / 1e6).toFixed(1)} MB</small>`;
  };
  try {
    const man = await (await fetch("assets/manifest.json?v=" + Date.now())).json();
    window.JUUKI_TEXV = man.texV;
    const T = (navigator.maxTouchPoints || 0) > 1, U = new URLSearchParams(location.search), lite = (T && !U.has("full")) || U.has("lite");
    man.files = man.files.filter(f => f[0].startsWith("assets/lite/") ? lite : /^assets\/(tex|models)\/|bg3\.jpg/.test(f[0]) ? !lite : true);   // 軽い版は assets/lite の画像だけ先に読む
    const all = man.files.reduce((a, f) => a + f[1], 0); let got = 0; show(0, all);
    const queue = man.files.slice().sort((a, b) => b[1] - a[1]);
    const worker = async () => {
      for (let f; (f = queue.shift());) {
        let n = 0;
        try {
          const r = await fetch(f[0]), rd = r.body.getReader();
          for (;;) { const { done, value } = await rd.read(); if (done) break; n += value.length; got += value.length; show(got, all); }
        } catch (e) { }
        got += Math.max(0, f[1] - n); show(got, all);      // 圧縮されて届いた分などの差をうめる
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  } catch (e) { console.warn("先読みできませんでした", e); }
  msg.textContent = "準備中…";
  for (const src of ["vendor/babylon.js", "vendor/HavokPhysics_umd.js", "vendor/babylonjs.loaders.min.js", "game.js?v=109"]) {
    await new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = ng; document.body.appendChild(sc); });
  }
})();
</script>
</body>
</html>
