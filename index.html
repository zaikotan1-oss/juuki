<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="重機">
<meta name="theme-color" content="#1b2838">
<link rel="manifest" href="manifest.webmanifest">
<title>重機で建てる（試作）</title>
<style>
html,body{margin:0;height:100%;background:#1b2838;overflow:hidden;touch-action:none;
  font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{display:none;position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));
  color:#fff;font-size:14px;line-height:1.45;background:#0008;padding:6px 10px;border-radius:10px;pointer-events:none;white-space:pre}
#btns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#btns .btn{font-size:11px;padding:5px 8px;border-radius:9px;box-shadow:0 2px 0 #0005}
.btn{border:0;border-radius:12px;background:#fffe;color:#223;font:inherit;font-weight:bold;font-size:13px;padding:7px 10px;
  box-shadow:0 3px 0 #0005;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.btn.on{background:#ffd23f}
.stick{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
  background:#0004;border:3px solid #fff8;pointer-events:none}
.stick .knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:#fffc;box-shadow:0 3px 8px #0006}
.stick .lab{position:absolute;left:-10px;right:-10px;bottom:118px;text-align:center;color:#fff;font-size:12px;font-weight:bold;line-height:1.3;background:#0008;border-radius:8px;padding:3px 5px}
#stL{left:calc(22px + env(safe-area-inset-left))}
#stR{right:calc(22px + env(safe-area-inset-right))}
#pedals{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:flex-end}
.pd{border:0;border-radius:14px;font:inherit;font-weight:bold;color:#223;background:#fffd;box-shadow:0 5px 0 #0006;touch-action:none}
.pd.on{transform:translateY(4px);box-shadow:0 1px 0 #0006;filter:brightness(.85)}
#pFwd,#pBack{width:68px;height:84px;font-size:15px}
#pFwd{background:#8fe08f} #pBack{background:#f4b2a0}
#bRide{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));font-size:16px;padding:9px 20px;background:#fffe}
#bRide.on{background:#7fd1ff}
#bRide:active{transform:translate(-50%,2px)}
#pLeft,#pRight{width:48px;height:58px;font-size:20px}
#done{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);color:#223;font-size:22px;font-weight:bold;background:#ffd23f;padding:12px 22px;border-radius:18px;text-align:center;box-shadow:0 6px 0 #0005;pointer-events:none}
#done .btn{pointer-events:auto;margin:10px 5px 0;font-size:16px;padding:9px 14px}
#done .rT{font-size:24px} #rStars{font-size:34px;color:#d9480f;letter-spacing:6px;text-shadow:0 2px 0 #fff8} #rInfo{font-size:14px;white-space:pre-line;margin-top:4px}
#goal{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));width:min(28vw,220px);color:#fff;background:#0007;border-radius:8px;padding:4px 7px;pointer-events:none;font-weight:bold}
#gStage{font-size:10px;opacity:.8} #gText{font-size:12px;line-height:1.25;margin:1px 0 3px} #gScore{position:absolute;right:7px;top:3px;font-size:10px;color:#ffd23f}
.gbar{position:relative;height:11px;background:#fff3;border-radius:6px;overflow:hidden;margin-top:2px} .gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffcf3f,#f08c00);transition:width .3s}
.gbar.tr i{background:linear-gradient(#8fe08f,#2f9e44)} .gbar span{position:relative;font-size:10px;padding-left:5px;line-height:11px;text-shadow:0 1px 2px #000}
#pops{position:absolute;left:50%;top:30%;width:0;height:0;pointer-events:none}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;color:#fff;font-weight:900;font-size:21px;text-shadow:0 3px 0 #000a,0 0 8px #000;animation:popup 1.3s ease-out forwards}
.pop.mid{font-size:27px;color:#ffd23f} .pop.big{font-size:34px;color:#ff922b} .pop.mile{font-size:25px;color:#8ce99a;top:45px} .pop.load{font-size:20px;color:#8ce99a;top:82px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px)}}
#stages{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1b2838ee;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #0005;width:min(90vw,600px);max-height:92vh;overflow:auto;z-index:20}
.stCols{display:flex;gap:14px;flex-wrap:wrap} .stCol{flex:1 1 230px;display:flex;flex-direction:column;gap:5px;border-radius:12px;padding:8px}
.stCol.d{background:#ffb02e} .stCol.b{background:#5fb3f0}
.stCol.d .stBtn{background:#fff3df} .stCol.b .stBtn{background:#e6f4ff}
.stHead{font-size:15px;font-weight:900;color:#fff;text-align:center;text-shadow:0 1px 2px #0008;padding:2px}
.stBtn.now{outline:3px solid #223} .stClose{font-size:13px;align-self:center}
.stTitle{font-size:17px;font-weight:900;color:#fff;text-align:center} .stBtn{font-size:13px;text-align:left;padding:6px 10px;box-shadow:0 2px 0 #0004} .stBtn small{display:block;font-size:10px;font-weight:bold;opacity:.82;margin-top:1px} .stBtn.locked{opacity:.55}
.stUp{font-size:17px;color:#223;white-space:pre-line;font-weight:bold}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);color:#fff;font-size:19px;font-weight:bold;background:#0009;padding:7px 16px;border-radius:14px;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));max-width:40vw;text-align:center;color:#fff;font-size:15px;font-weight:bold;background:#0009;padding:7px 12px;border-radius:14px;pointer-events:none}
#msg .lbar{width:260px;height:10px;background:#fff3;border-radius:5px;margin:10px auto 6px;overflow:hidden}#msg .lbar i{display:block;height:100%;background:#7cd67c}#msg small{font-size:14px;opacity:.85}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:22px;background:#000a;padding:14px 22px;border-radius:14px;text-align:center;white-space:pre-line}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">読み込み中…</div>
<div id="btns">
  <button class="btn" id="bStage">ステージ</button>
  <button class="btn" id="bView">運転席</button>
  <button class="btn" id="bShadow">影 ON</button>
  <button class="btn" id="bQuality">画質 高</button>
  <button class="btn" id="bReset">やり直し</button>
</div>
<div class="stick" id="stL"><div class="lab" id="labL"></div><div class="knob"></div></div>
<div id="pedals"><button class="pd" id="pLeft">◀</button><button class="pd" id="pBack">バック</button><button class="pd" id="pFwd">アクセル</button><button class="pd" id="pRight">▶</button></div>
<div class="stick" id="stR"><div class="lab" id="labR"></div><div class="knob"></div></div>
<button class="btn" id="bRide" style="display:none">おりる</button>
<div id="msg">読み込み中…</div>
<div id="done" style="display:none"><div class="rT">さら地 かんせい！</div><div id="rStars"></div><div id="rInfo"></div>
<div class="rBtns"><button class="btn" id="bNext">つぎの ビルへ ▶</button><button class="btn" id="bBuild">クレーンで 建てる ▶</button><button class="btn" id="bAgain">ステージを えらぶ</button></div></div>
<div id="goal"><div id="gStage"></div><div id="gText">読み込み中…</div><div class="gbar"><i id="gBld"></i><span id="gBldT"></span></div><div class="gbar tr"><i id="gTr"></i><span id="gTrT"></span></div><div id="gScore"></div></div>
<div id="pops"></div>
<div id="stages" style="display:none"></div>
<div id="toast" style="display:none"></div>
<div id="hint" style="display:none"></div>
<script>
// 読み込み画面: 先に全ファイルを取ってきて「何MB中何MB」を出す（ブラウザに残るので、後でゲームが読む時は一瞬）
(async () => {
  const msg = document.getElementById("msg");
  const show = (got, all) => {
    const pc = all ? Math.min(100, Math.floor(got / all * 100)) : 0;
    msg.innerHTML = `読み込み中… ${pc}%<div class="lbar"><i style="width:${pc}%"></i></div><small>${(got / 1e6).toFixed(1)} / ${(all / 1e6).toFixed(1)} MB</small>`;
  };
  try {
    const man = await (await fetch("assets/manifest.json?v=" + Date.now())).json();
    window.JUUKI_TEXV = man.texV;
    const T = (navigator.maxTouchPoints || 0) > 1, U = new URLSearchParams(location.search), lite = (T && !U.has("full")) || U.has("lite");
    man.files = man.files.filter(f => f[0].startsWith("assets/lite/") ? lite : /^assets\/(tex|models)\/|bg3\.jpg/.test(f[0]) ? !lite : true);   // 軽い版は assets/lite の画像だけ先に読む
    const all = man.files.reduce((a, f) => a + f[1], 0); let got = 0; show(0, all);
    const queue = man.files.slice().sort((a, b) => b[1] - a[1]);
    const worker = async () => {
      for (let f; (f = queue.shift());) {
        let n = 0;
        try {
          const r = await fetch(f[0]), rd = r.body.getReader();
          for (;;) { const { done, value } = await rd.read(); if (done) break; n += value.length; got += value.length; show(got, all); }
        } catch (e) { }
        got += Math.max(0, f[1] - n); show(got, all);      // 圧縮されて届いた分などの差をうめる
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  } catch (e) { console.warn("先読みできませんでした", e); }
  msg.textContent = "準備中…";
  for (const src of ["vendor/babylon.js", "vendor/HavokPhysics_umd.js", "vendor/babylonjs.loaders.min.js", "game.js?v=95"]) {
    await new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = ng; document.body.appendChild(sc); });
  }
})();
</script>
</body>
</html>
