<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="重機">
<meta name="theme-color" content="#1b2838">
<link rel="manifest" href="manifest.webmanifest">
<title>重機で建てる（試作）</title>
<style>
html,body{margin:0;height:100%;background:#1b2838;overflow:hidden;touch-action:none;
  font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));
  color:#fff;font-size:14px;line-height:1.45;background:#0008;padding:6px 10px;border-radius:10px;pointer-events:none;white-space:pre}
#btns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.btn{border:0;border-radius:12px;background:#fffe;color:#223;font:inherit;font-weight:bold;font-size:16px;padding:10px 14px;
  box-shadow:0 4px 0 #0005;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.btn.on{background:#ffd23f}
.stick{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;
  background:#0004;border:3px solid #fff8;pointer-events:none}
.stick .knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:#fffc;box-shadow:0 3px 8px #0006}
.stick .lab{position:absolute;left:-10px;right:-10px;bottom:160px;text-align:center;color:#fff;font-size:16px;font-weight:bold;line-height:1.35;background:#000a;border-radius:10px;padding:5px 6px}
#stL{left:calc(34px + env(safe-area-inset-left))}
#stR{right:calc(34px + env(safe-area-inset-right))}
#pedals{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
.pd{border:0;border-radius:14px;font:inherit;font-weight:bold;color:#223;background:#fffd;box-shadow:0 5px 0 #0006;touch-action:none}
.pd.on{transform:translateY(4px);box-shadow:0 1px 0 #0006;filter:brightness(.85)}
#pFwd,#pBack{width:96px;height:120px;font-size:20px}
#pFwd{background:#8fe08f} #pBack{background:#f4b2a0}
#pLeft,#pRight{width:66px;height:80px;font-size:28px}
#done{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);color:#223;font-size:30px;font-weight:bold;background:#ffd23f;padding:18px 30px;border-radius:18px;text-align:center;box-shadow:0 6px 0 #0005;pointer-events:none}
#done .btn{pointer-events:auto;margin-top:12px;font-size:22px;padding:12px 22px}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);color:#fff;font-size:26px;font-weight:bold;background:#0009;padding:10px 22px;border-radius:14px;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom));max-width:46vw;text-align:center;color:#fff;font-size:21px;font-weight:bold;background:#000b;padding:10px 16px;border-radius:14px;pointer-events:none}
#msg .lbar{width:260px;height:10px;background:#fff3;border-radius:5px;margin:10px auto 6px;overflow:hidden}#msg .lbar i{display:block;height:100%;background:#7cd67c}#msg small{font-size:14px;opacity:.85}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:22px;background:#000a;padding:14px 22px;border-radius:14px;text-align:center;white-space:pre-line}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">読み込み中…</div>
<div id="btns">
  <button class="btn" id="bView">運転席</button>
  <button class="btn" id="bShadow">影 ON</button>
  <button class="btn" id="bQuality">画質 高</button>
  <button class="btn" id="bReset">やり直し</button>
</div>
<div class="stick" id="stL"><div class="lab" id="labL"></div><div class="knob"></div></div>
<div id="pedals"><button class="pd" id="pLeft">◀</button><button class="pd" id="pBack">バック</button><button class="pd" id="pFwd">アクセル</button><button class="pd" id="pRight">▶</button></div>
<div class="stick" id="stR"><div class="lab" id="labR"></div><div class="knob"></div></div>
<div id="msg">読み込み中…</div>
<div id="done" style="display:none">さら地になりました！<br><button class="btn" id="bBuild">クレーンで建てる ▶</button></div>
<div id="toast" style="display:none"></div>
<div id="hint" style="display:none"></div>
<script>
// 読み込み画面: 先に全ファイルを取ってきて「何MB中何MB」を出す（ブラウザに残るので、後でゲームが読む時は一瞬）
(async () => {
  const msg = document.getElementById("msg");
  const show = (got, all) => {
    const pc = all ? Math.min(100, Math.floor(got / all * 100)) : 0;
    msg.innerHTML = `読み込み中… ${pc}%<div class="lbar"><i style="width:${pc}%"></i></div><small>${(got / 1e6).toFixed(1)} / ${(all / 1e6).toFixed(1)} MB</small>`;
  };
  try {
    const man = await (await fetch("assets/manifest.json?v=" + Date.now())).json();
    window.JUUKI_TEXV = man.texV;
    const T = (navigator.maxTouchPoints || 0) > 1, U = new URLSearchParams(location.search), lite = (T && !U.has("full")) || U.has("lite");
    man.files = man.files.filter(f => f[0].startsWith("assets/lite/") ? lite : /^assets\/(tex|models)\/|bg3\.jpg/.test(f[0]) ? !lite : true);   // 軽い版は assets/lite の画像だけ先に読む
    const all = man.files.reduce((a, f) => a + f[1], 0); let got = 0; show(0, all);
    const queue = man.files.slice().sort((a, b) => b[1] - a[1]);
    const worker = async () => {
      for (let f; (f = queue.shift());) {
        let n = 0;
        try {
          const r = await fetch(f[0]), rd = r.body.getReader();
          for (;;) { const { done, value } = await rd.read(); if (done) break; n += value.length; got += value.length; show(got, all); }
        } catch (e) { }
        got += Math.max(0, f[1] - n); show(got, all);      // 圧縮されて届いた分などの差をうめる
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  } catch (e) { console.warn("先読みできませんでした", e); }
  msg.textContent = "準備中…";
  for (const src of ["vendor/babylon.js", "vendor/HavokPhysics_umd.js", "vendor/babylonjs.loaders.min.js", "game.js?v=52"]) {
    await new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = ng; document.body.appendChild(sc); });
  }
})();
</script>
</body>
</html>
