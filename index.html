<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="まちこわし">
<meta name="theme-color" content="#1b2838">
<title>まち こわし</title>
<style>
:root{--panel:#1d2530cc;--edge:#ffffff40}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2838;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{width:100%;height:100%;display:block;touch-action:none;outline:none}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:22px;background:#000a;padding:14px 22px;border-radius:14px;text-align:center;white-space:pre-line;z-index:20}
#msg .lbar{width:260px;height:10px;background:#fff3;border-radius:5px;margin:10px auto 6px;overflow:hidden}#msg .lbar i{display:block;height:100%;background:#7cd67c}#msg small{font-size:14px;opacity:.85}
/* 上の帯: お金・荷台・まち（小さく・景色を隠さない） */
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));color:#fff;pointer-events:none;font-weight:900;text-shadow:0 1px 2px #000}
#money{font-size:24px;color:#ffd23f;-webkit-text-stroke:1.5px #5a2a00;paint-order:stroke fill;letter-spacing:1px}
#bedBox{width:min(38vw,190px);margin-top:3px;background:var(--panel);border:1.5px solid var(--edge);border-radius:8px;padding:3px 6px}
#bedT{font-size:11px}
.gbar{height:9px;background:#fff3;border-radius:5px;overflow:hidden;margin-top:2px}
#bedBar{height:100%;width:0;background:linear-gradient(#ffcf3f,#f08c00);transition:width .15s}
#bedBar.full{background:linear-gradient(#ff8a8a,#e03131);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
#city{font-size:11px;margin-top:3px;opacity:.9}
#map{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:120px;height:120px;border-radius:8px;border:1.5px solid var(--edge);pointer-events:none;opacity:.92}
#bZoom{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(136px + env(safe-area-inset-top));width:48px;height:36px;border-radius:10px;border:1.5px solid var(--edge);background:var(--panel);color:#fff;font-size:15px;font-weight:bold}
/* スティック: 左側をさわった所に出る */
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;pointer-events:none}
#joyK{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#ffd23fcc;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 3px 8px #0006}
#joyHint{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px dashed #ffffff55;color:#fff9;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
/* 強化の店: ひきとりじょの中だけ右下に出る */
#shop{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));width:min(62vw,300px);background:var(--panel);border:1.5px solid var(--edge);border-radius:12px;padding:6px;color:#fff}
#shop h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#shopClose{background:none;border:none;color:#fff;font-size:18px}
.upBtn{display:flex;align-items:center;gap:6px;width:100%;margin:3px 0;padding:5px 7px;border-radius:9px;border:1.5px solid #ffffff30;background:#ffffff14;color:#fff9;font:inherit;text-align:left}
.upBtn.can{background:linear-gradient(#3fa34d,#2b7a37);color:#fff;border-color:#b2f2bb}
.upBtn.sel{outline:2px solid #ffd23f}
.upBtn .ic{font-size:20px}.upBtn .nm{flex:1;font-size:14px;font-weight:bold;line-height:1.1}.upBtn small{display:block;font-size:10px;font-weight:normal;opacity:.85}.upBtn .pr{font-size:13px;font-weight:900;color:#ffd23f}
#rebuild{width:100%;margin-top:4px;padding:6px;border-radius:9px;border:none;background:#4dabf7;color:#fff;font:inherit;font-weight:bold}
/* 文字のポップ */
#pops{position:absolute;left:50%;top:30%;width:0;height:0;pointer-events:none;z-index:6}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;color:#fff;font-weight:900;font-size:21px;-webkit-text-stroke:1.5px #3a1d00;paint-order:stroke fill;letter-spacing:1px;text-shadow:0 3px 0 #000a;animation:popup 1.3s ease-out forwards}
.pop.mid{font-size:27px;color:#ffd23f} .pop.mile{font-size:23px;color:#8ce99a;top:45px}
.pop.big{font-size:40px;color:#ffd23f;text-shadow:0 4px 0 #b84a00,0 0 18px #ff8a00aa;animation:popbig 1.5s ease-out forwards}
.pop.huge{font-size:44px;color:#ffe066;text-shadow:0 4px 0 #2b8a3e,0 0 18px #69db7caa;animation:popbig 1.6s ease-out forwards}
.pop.tiny{font-size:15px;animation:poptiny .7s ease-out forwards;left:var(--dx,0)} .pop.tiny.gold{font-size:20px;color:#ffd23f} .pop.tiny.gold.huge{font-size:26px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px)}}
@keyframes popbig{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,0) scale(1.35) rotate(3deg)}24%{transform:translate(-50%,0) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@keyframes poptiny{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px)}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fffbe8 0,#fff6d0aa 40%,#fff0 75%);opacity:0;z-index:5}
#flash.warm{background:radial-gradient(circle at 50% 45%,#fff3c8 0,#ffc26baa 40%,#ff8a0000 75%)}
#combo{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:none;color:#fff;font-weight:900;font-size:13px;background:var(--panel);border:1.5px solid var(--edge);border-radius:999px;padding:3px 12px;text-shadow:0 1px 1px #000}
#combo b{font-size:20px;color:#ffd23f;margin-right:3px}
#combo[data-tier="2"] b{color:#ff9f43} #combo[data-tier="3"]{background:linear-gradient(#ff8a3d,#c2410c)} #combo[data-tier="3"] b{color:#fff}
#combo.bump{animation:cbump .18s ease-out}
@keyframes cbump{0%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
/* はじめの画面 */
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0005;z-index:10}
#start div{background:#ffd23f;color:#3a1d00;border-radius:20px;padding:16px 26px;text-align:center;box-shadow:0 6px 0 #0005;font-weight:900}
#start h1{margin:0;font-size:34px;letter-spacing:2px}
#start p{margin:8px 0 0;font-size:14px;line-height:1.6}
#start b{display:inline-block;margin-top:10px;background:#3a1d00;color:#ffd23f;border-radius:999px;padding:6px 18px;font-size:16px;animation:blink .7s infinite alternate}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div id="money">¥0</div><div id="bedBox"><div id="bedT">にだい 0</div><div class="gbar"><div id="bedBar"></div></div></div><div id="city"></div></div>
<canvas id="map" width="240" height="240"></canvas>
<button id="bZoom">🔍</button>
<div id="joyHint">ここを<br>さわって<br>うごかす</div>
<div id="joy" style="display:none"><div id="joyK"></div></div>
<div id="shop" style="display:none"><h3>🏗 きょうか<button id="shopClose">✕</button></h3><div id="shopList"></div><button id="rebuild" style="display:none">🏙 まちを たてなおす</button></div>
<div id="combo" style="display:none"><b>0</b>れんぞく</div>
<div id="pops"></div>
<div id="flash"></div>
<div id="start"><div><h1>まち こわし</h1><p>ショベルを うごかして まちを こわそう<br>がれきは うしろの にだいに すいこむ<br>いっぱいになったら 🟨ひきとりじょ で お金に！</p><b>さわって スタート</b></div></div>
<div id="msg">読み込み中…</div>
<script>
// 読み込み画面: 先に全ファイルを取ってきて「何MB中何MB」を出す（juuki と同じ）
(async () => {
  const msg = document.getElementById("msg");
  const show = (got, all) => {
    const pc = all ? Math.min(100, Math.floor(got / all * 100)) : 0;
    msg.innerHTML = `読み込み中… ${pc}%<div class="lbar"><i style="width:${pc}%"></i></div><small>${(got / 1e6).toFixed(1)} / ${(all / 1e6).toFixed(1)} MB</small>`;
  };
  try {
    const man = await (await fetch("assets/manifest.json?v=" + Date.now())).json();
    window.JUUKI_TEXV = man.texV;
    const T = (navigator.maxTouchPoints || 0) > 1, U = new URLSearchParams(location.search), lite = (T && !U.has("full")) || U.has("lite");
    man.files = man.files.filter(f => f[0].startsWith("assets/lite/") ? lite : /^assets\/(tex|models)\/|bg3\.jpg/.test(f[0]) ? !lite : true);
    const all = man.files.reduce((a, f) => a + f[1], 0); let got = 0; show(0, all);
    const queue = man.files.slice().sort((a, b) => b[1] - a[1]);
    const worker = async () => {
      for (let f; (f = queue.shift());) {
        let n = 0;
        try {
          const r = await fetch(f[0]), rd = r.body.getReader();
          for (;;) { const { done, value } = await rd.read(); if (done) break; n += value.length; got += value.length; show(got, all); }
        } catch (e) { }
        got += Math.max(0, f[1] - n); show(got, all);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  } catch (e) { console.warn("先読みできませんでした", e); }
  msg.textContent = "まちを つくっています…";
  for (const src of ["vendor/babylon.js", "vendor/HavokPhysics_umd.js", "vendor/babylonjs.loaders.min.js", "game.js?v=1"]) {
    await new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = ng; document.body.appendChild(sc); });
  }
})();
</script>
</body>
</html>
